name: Supabase Keep Alive

on:
  schedule:
    - cron: '0 0 * * *'

  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase
        run: |
          curl -f -sS \
            "${{ secrets.https://dusxuppoolkwuaosavlt.supabase.co }}/rest/v1/keep_alive?select=id&limit=1" -H "apikey: ${{ secrets.sb_publishable_ptryFr0b7vE0j3AVOp0MBg_8CHEBoyc }}" -H "Authorization: Bearer ${{ secrets.sb_publishable_ptryFr0b7vE0j3AVOp0MBg_8CHEBoyc }}"