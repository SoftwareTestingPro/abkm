name: Supabase Keep Alive

on:
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 12 * * *'

  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase
        run: |
          curl -f -sS "${{ secrets.SUPABASE_URL }}/rest/v1/keep_alive?select=id&limit=1" -H "apikey: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" -H "Authorization: Bearer ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}"